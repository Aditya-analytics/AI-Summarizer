<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Summarizer</title>
    <style>
        /* Light themed classic system */
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 2.5rem;
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fafafa;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            align-self: flex-end;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.3);
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .output-group {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .output-group h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        #summary-output {
            padding: 1.5rem;
            background-color: #f8fafc;
            border-radius: 8px;
            line-height: 1.7;
            white-space: pre-wrap;
            border: 1px solid var(--border);
            min-height: 100px;
            font-size: 1.05rem;
            color: #334155;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 1.1rem;
            background-color: var(--primary);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AI Summarizer ✨</h1>
        <p class="subtitle">Paste your text below to get an instant, streaming summary.</p>

        <div class="input-group">
            <textarea id="text-input" placeholder="Enter raw text, a Wikipedia link, or a YouTube URL here..."></textarea>
            
            <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px; padding: 0.5rem; border: 1px dashed var(--primary); border-radius: 8px; background: #eff6ff; display: flex; align-items: center; justify-content: space-between;">
                    <span style="font-size: 0.9rem; color: var(--primary); font-weight: 600;">Or upload PDF:</span>
                    <input type="file" id="file-input" accept=".pdf" style="max-width: 180px;">
                </div>
                
                <select id="length-select" style="padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border);">
                    <option value="short">Short</option>
                    <option value="standard" selected>Standard</option>
                    <option value="detailed">Detailed</option>
                </select>

                <select id="language-select" style="padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border);">
                    <option value="English" selected>English</option>
                    <option value="Hindi">Hindi</option>
                </select>
            </div>
            
            <button id="summarize-btn">Generate Summary</button>
        </div>

        <div class="output-group" id="output-section">
            <h2>Summary Output</h2>
            <div id="summary-output"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const summarizeBtn = document.getElementById('summarize-btn');
        const textInput = document.getElementById('text-input');
        const fileInput = document.getElementById('file-input');
        const outputSection = document.getElementById('output-section');
        const summaryOutput = document.getElementById('summary-output');

        summarizeBtn.addEventListener('click', async () => {
            const text = textInput.value.trim();
            const lengthValue = document.getElementById('length-select').value;
            const languageValue = document.getElementById('language-select').value;

            if (!text && fileInput.files.length === 0) return;

            // Reset UI for generating
            summarizeBtn.disabled = true;
            summarizeBtn.textContent = 'Summarizing...';
            outputSection.style.display = 'block';
            summaryOutput.innerHTML = '<span class="cursor"></span>';

            let endpointUrl = 'http://127.0.0.1:8000/summarization/text';
            let fetchOptions = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
            };

            // THE ULTIMATE SMART BOX ROUTING
            if (fileInput.files.length > 0) {
                // Route 1: PDF File
                endpointUrl = 'http://127.0.0.1:8000/summarization/pdf';
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                formData.append('length', lengthValue);
                formData.append('language', languageValue);
                
                // When sending FormData, DO NOT set Content-Type header. 
                // The browser sets it automatically to multipart/form-data with the boundary.
                fetchOptions = {
                    method: 'POST',
                    body: formData
                };
            } else if (text.startsWith('http://') || text.startsWith('https://')) {
                // Route 2: URLs
                if (text.includes('youtube.com') || text.includes('youtu.be')) {
                    endpointUrl = 'http://127.0.0.1:8000/summarization/youtube_url';
                } else {
                    endpointUrl = 'http://127.0.0.1:8000/summarization/url';
                }
                fetchOptions.body = JSON.stringify({ url: text, length: lengthValue, language: languageValue });
            } else {
                // Route 3: Raw Text
                fetchOptions.body = JSON.stringify({ text: text, length: lengthValue, language: languageValue });
            }

            try {
                // Connect to the backend
                const response = await fetch(endpointUrl, fetchOptions);

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Network response was not ok');
                }

                // Read the live stream data
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                summaryOutput.innerHTML = ''; 
                
                let fullSummary = ""; 

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    fullSummary += decoder.decode(value, { stream: true });
                    const html = marked.parse(fullSummary);
                    summaryOutput.innerHTML = html + '<span class="cursor"></span>';
                }

                const cursor = document.querySelector('.cursor');
                if (cursor) cursor.remove();

            } catch (error) {
                summaryOutput.innerHTML = `<span style="color: red; font-weight: bold;">Error: ${error.message}</span>`;
            } finally {
                summarizeBtn.disabled = false;
                summarizeBtn.textContent = 'Generate Summary';
            }
        });
    </script>
</body>

</html>
